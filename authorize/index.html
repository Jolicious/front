<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in — Front help center</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#0b0910;color:#f5f5f7}
  .card{padding:28px 32px;border:1px solid #2a2a33;border-radius:12px;background:#14131a;min-width:280px}
  .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8b8b96;margin-bottom:6px}
  .name{font-size:20px;font-weight:600}
  .email{font-size:14px;color:#a9a9b3;margin-top:4px}
  .note{font-size:12px;color:#6f6f7a;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="label">Signed in as</div>
  <div class="name">bac test1</div>
  <div class="email">bac@unkn3wndb.site</div>
  <div class="note">Redirecting to the help center…</div>
</div>
<script>
  // Test IdP authorize shim. Shows the identity it will assert, then returns to the
  // knowledge base callback with a code and the caller's state.
  const q = new URLSearchParams(location.search);
  const redirectUri = q.get('redirect_uri') || 'https://meowaa.frontkb.com/auth/callback';
  const state = q.get('state') || '';
  const code = 'test-code-' + Math.random().toString(36).slice(2);
  const url = redirectUri + '?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state);
  setTimeout(() => location.replace(url), 1200);
</script>
</body>
</html>
